query GetHomePage {
  homePage {
    data {
      attributes {
        cases {
          ...GetHomeCases
        }

        banera_dlya_glavnoj_straniczies {
          data {
            attributes {
              keywords

              link

              desktopMedia {
                data {
                  attributes {
                    ...MediaFragment
                  }
                }
              }

              mobileMedia {
                data {
                  attributes {
                    ...MediaFragment
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
