query GetCaseById($id: ID) {
  case(id: $id) {
    data {
      attributes {
        mobileName

        backround

        content {
          ... on ComponentImageBlocksAboutProject {
            id
            idBlock
            client
            industry
            deadline
            tasks
          }

          ... on ComponentImageBlocksOneImage {
            idBlock
            id
            image {
              data {
                attributes {
                  ...MediaFragment
                }
              }
            }
          }

          ... on ComponentImageBlocksGridImage {
            idBlock
            id
            selectStreech
            threeImage {
              data {
                attributes {
                  ...MediaFragment
                }
              }
            }
            twoImage {
              data {
                attributes {
                  ...MediaFragment
                }
              }
            }
            oneImage {
              data {
                attributes {
                  ...MediaFragment
                }
              }
            }
          }

          ... on ComponentImageBlocksDoubleImage {
            id
            idBlock
            imageTwo {
              data {
                attributes {
                  ...MediaFragment
                }
              }
            }
            imageOne {
              data {
                attributes {
                  ...MediaFragment
                }
              }
            }
          }

          ... on ComponentImageBlocksTextBlock {
            id
            idBlock
            title
            description
          }

          ... on ComponentImageBlocksVideo {
            id
            idBlock

            video {
              data {
                attributes {
                  ...MediaFragment
                }
              }
            }
          }
        }
      }
    }
  }
}
